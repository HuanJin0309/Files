# Abstract:
#  Deploys Files (Sideload).
#
# Workflow:
#  1. Configure manifest, logo and secrets
#  2. Restore, build and package Files
#  3. Publish the appinstaller to files.community
#  4. Sign the package
#  5. Publish the package to Azure

name: Files CD (Sideload Stable)

# 触发条件：仅支持「手动触发」（通过 GitHub Actions 页面点击运行）
on:
  workflow_dispatch:

# 定义任务（Job）：唯一任务为「build」（构建与部署）
jobs:
  build:
    # 运行环境：使用最新版 Windows 系统（因 Files 是 Windows 应用，依赖 Windows 构建工具）
    runs-on: windows-2025-vs2026
    # 环境配置：关联「Deployments」环境（通常用于管理部署相关的敏感变量/审批流程）
    environment: Deployments
    # 构建策略配置
    strategy:
      # 失败策略：不快速失败（即一个矩阵任务失败不影响其他，但此处矩阵仅1组，实际无影响）
      fail-fast: false
      # 构建矩阵：定义构建的配置和平台（仅 Release 配置 + x64 平台）
      matrix:
        configuration: [Release]  # 构建配置：Release（正式发布版，无调试信息）
        platform: [x64]           # 目标平台：x64（64位 Windows 系统）

    # 环境变量定义：全局复用的路径和配置，避免硬编码
    env:
      SOLUTION_NAME:              'Files.slnx'  # 解决方案文件名（VS 解决方案文件）
      CONFIGURATION:              '${{ matrix.configuration }}'  # 引用矩阵中的构建配置
      PLATFORM:                   '${{ matrix.platform }}'       # 引用矩阵中的目标平台
      APPX_BUNDLE_PLATFORMS:      'x64|arm64'  # 应用包捆绑的平台（支持 x64 和 arm64 双平台）
      WORKING_DIR:                '${{ github.workspace }}'  # 工作目录（GitHub 仓库克隆后的根目录）
      ARTIFACTS_STAGING_DIR:      '${{ github.workspace }}\artifacts'  # 构建产物暂存目录
      APPX_PACKAGE_DIR:           '${{ github.workspace }}\artifacts\AppxPackages'  # 应用包输出目录
      PACKAGE_PROJECT_DIR:        'src\Files.App (Package)'  # 应用包项目目录（包含打包配置）
      PACKAGE_PROJECT_PATH:       'src\Files.App (Package)\Files.Package.wapproj'  # 应用包项目文件路径
      PACKAGE_MANIFEST_PATH:      'src\Files.App (Package)\Package.appxmanifest'  # 应用清单路径（定义应用身份、权限等）
      LAUNCHER_PROJECT_PATH:      'src\Files.App.Launcher\Files.App.Launcher.vcxproj'  # 启动器项目路径（C++ 项目）
      TEST_PROJECT_PATH:          'tests\Files.InteractionTests\Files.InteractionTests.csproj'  # 交互测试项目路径（暂未使用）
      APP_INSTALLER_SIDELOAD_URL: 'https://cdn.files.community/files/stable/'  # appinstaller 文件的远程访问 URL
      # 证书文件名统一定义（避免路径重复书写，便于维护）
      SELF_SIGNED_PFX_FILENAME:       'Files_SelfSigned.pfx'  # 自签名证书文件（PFX 格式，含私钥）
      SELF_SIGNED_CER_FILENAME:       'Files_SelfSigned.cer'  # 自签名证书文件（CER 格式，仅公钥，用于安装）

    steps:
    # 步骤1：克隆代码仓库到工作目录
    - name: Checkout the repository
      uses: actions/checkout@v4  # 使用官方 Checkout 动作，版本 v4

    # 核心修复：安装 VS2022 v143 工具集（官方支持，一键安装无冲突）
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3

    # 步骤4：配置 .NET 环境（Files 基于 .NET 开发）
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    # 步骤5：配置应用清单、图标和敏感信息（核心配置步骤）
    - name: Configure the package manifest, logo, and secrets
      shell: pwsh
      run: |
        $fullManifestPath = Join-Path -Path "${{ github.workspace }}" -ChildPath "${{ env.PACKAGE_MANIFEST_PATH }}"
        Write-Host "Using Package.appxmanifest path: $fullManifestPath"
        . './.github/scripts/Configure-AppxManifest.ps1' `
          -Branch "SideloadStable" `
          -PackageManifestPath "$fullManifestPath" `
          -Publisher "$env:SIDELOAD_PUBLISHER_SECRET" `
          -WorkingDir "${{ github.workspace }}" `
          -SecretBingMapsKey "$env:SECRET_BINGMAPS_KEY" `
          -SecretSentry "$env:SECRET_SENTRY" `
          -SecretGitHubOAuthClientId "$env:SECRET_GITHUB_OAUTH_CLIENT_ID"
      env:
        SIDELOAD_PUBLISHER_SECRET: ${{ secrets.SIDELOAD_PUBLISHER_SECRET }}
        SECRET_BINGMAPS_KEY:       ${{ secrets.BING_MAPS_SECRET }}
        SECRET_SENTRY:             ${{ secrets.SENTRY_SECRET }}
        SECRET_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
        PACKAGE_MANIFEST_PATH:     ${{ env.PACKAGE_MANIFEST_PATH }}

    # 步骤6：从应用清单中提取版本号（用于后续版本命名）
    - name: Extract version from Package.appxmanifest
      id: extract_manifest_version
      shell: pwsh
      run: |
        $manifest = [xml](Get-Content -Path $env:PACKAGE_MANIFEST_PATH -Encoding UTF8)
        $manifestVersion = $manifest.Package.Identity.Version
        if ([string]::IsNullOrEmpty($manifestVersion)) {
          throw "Failed to extract version (Identity/Version node missing in $env:PACKAGE_MANIFEST_PATH)"
        }
        $preReleasePrefix = "v$($manifestVersion -replace '\.\d+$', '')-sideload-pre"
        echo "MANIFEST_VERSION=$manifestVersion" >> $env:GITHUB_ENV
        echo "PRE_RELEASE_PREFIX=$preReleasePrefix" >> $env:GITHUB_ENV
        Write-Host "Extracted version: $manifestVersion → Pre-release prefix: $preReleasePrefix"

    # 步骤7：生成自签名证书（PFX 格式含私钥，CER 格式含公钥）
    - name: Generate self-signed cert (PFX → CER)
      id: generate_cert
      shell: pwsh
      run: |
        $pfxFullPath = Join-Path -Path "${{ env.ARTIFACTS_STAGING_DIR }}" -ChildPath "${{ env.SELF_SIGNED_PFX_FILENAME }}"
        $cerFullPath = Join-Path -Path "${{ env.ARTIFACTS_STAGING_DIR }}" -ChildPath "${{ env.SELF_SIGNED_CER_FILENAME }}"
        if (-not (Test-Path "${{ env.ARTIFACTS_STAGING_DIR }}")) {
          New-Item -Path "${{ env.ARTIFACTS_STAGING_DIR }}" -ItemType Directory -Force | Out-Null
        }
        $certScript = "./.github/scripts/Generate-SelfCertPfx.ps1"
        if (-not (Test-Path $certScript)) { throw "Cert script missing: $certScript" }
        & $certScript -Destination "$pfxFullPath" -ValidityDays 365
        $pfxCert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfxFullPath, "", [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
        [System.IO.File]::WriteAllBytes($cerFullPath, $pfxCert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
        if (-not (Test-Path $pfxFullPath) -or (Get-Item $pfxFullPath).Length -eq 0) { throw "PFX generation failed: $pfxFullPath" }
        if (-not (Test-Path $cerFullPath) -or (Get-Item $cerFullPath).Length -eq 0) { throw "CER generation failed: $cerFullPath" }
        echo "pfx_full_path=$pfxFullPath" >> $env:GITHUB_OUTPUT
        echo "cer_full_path=$cerFullPath" >> $env:GITHUB_OUTPUT
        Write-Host "Generated certs: PFX($pfxFullPath) | CER($cerFullPath)"

    # 步骤8：启用 Windows SDK Preview 版本（适配最新 Windows 特性）
    - name: Use Windows SDK Preview
      shell: cmd
      run: |
        for /f %%a in ('dir /b /a:d %localappdata%\Microsoft\VisualStudio\17*') do echo UsePreviews=True>%localappdata%\Microsoft\VisualStudio\%%a\sdk.txt

    # 步骤9：恢复解决方案的依赖包（.NET 项目依赖）
    - name: Restore Files
      shell: pwsh
      run: |
        msbuild $env:SOLUTION_NAME `
        -t:Restore `
        -p:Platform=$env:PLATFORM `
        -p:Configuration=$env:CONFIGURATION `
        -p:PublishReadyToRun=true `
        -v:quiet

    # 步骤10：恢复启动器项目的 NuGet 依赖（C++ 项目单独恢复）
    - name: Restore NuGet Packages for Launcher Project
      shell: pwsh
      run: |
        nuget restore "$env:LAUNCHER_PROJECT_PATH" `
          -SolutionDirectory "$env:WORKING_DIR" `
          -Verbosity detailed

    # 步骤11：构建启动器项目（C++ 项目，用于启动主应用）
    - name: Build launcher project
      shell: pwsh
      run: |
        msbuild "$env:LAUNCHER_PROJECT_PATH" `
        -p:Platform=$env:PLATFORM `
        -p:Configuration=$env:CONFIGURATION `
        -p:PlatformToolset=v143 `
        -v:quiet

    # 步骤12：构建并打包应用（生成 MSIX 包和 appinstaller 文件）
    - name: Build & package Files
      shell: pwsh
      run: |
        msbuild "$env:PACKAGE_PROJECT_PATH" `
        -t:Build `
        -t:_GenerateAppxPackage `
        -p:Platform=$env:PLATFORM `
        -p:Configuration=$env:CONFIGURATION `
        -p:AppxBundlePlatforms=$env:APPX_BUNDLE_PLATFORMS `
        -p:AppxPackageDir="$env:APPX_PACKAGE_DIR" `
        -p:AppxBundle=Always `
        -p:UapAppxPackageBuildMode=Sideload `
        -p:GenerateAppInstallerFile=True `
        -p:AppInstallerUri=$env:APP_INSTALLER_SIDELOAD_URL `
        -p:AppxPackageSigningEnabled=true `
        -p:PackageCertificateKeyFile="${{ steps.generate_cert.outputs.pfx_full_path }}" `
        -p:PackageCertificatePassword="" `
        -p:PackageCertificateThumbprint="" `
        -v:quiet

    # 步骤13：删除产物目录中的空文件（减少不必要的文件体积）
    - name: Remove empty files from the packages
      shell: bash
      run: find $ARTIFACTS_STAGING_DIR -empty -delete

    # 步骤14：更新 appinstaller 文件的 XML  schema（适配新版 Windows 安装器）
    - name: Update appinstaller schema
      run: |
        $newSchema = "http://schemas.microsoft.com/appx/appinstaller/2018"
        $localFilePath = "${{ env.APPX_PACKAGE_DIR }}/Files.Package.appinstaller"
        $fileContent = Get-Content $localFilePath
        $fileContent = $fileContent.Replace("http://schemas.microsoft.com/appx/appinstaller/2017/2", $newSchema)
        $fileContent | Set-Content $localFilePath

    # 步骤16：将构建产物上传到 GitHub Actions Artifacts（供手动下载）
    - name: Upload the packages to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: 'Appx Packages (${{ env.CONFIGURATION }}, ${{ env.PLATFORM }})'
        path: ${{ env.ARTIFACTS_STAGING_DIR }}
      continue-on-error: false

    # 步骤17：生成唯一的预发布版本号（避免版本冲突）
    - name: Generate unique Pre-release version
      id: get_pre_release_version
      shell: pwsh
      run: |
        $preReleaseVersion = "$env:PRE_RELEASE_PREFIX-$(Get-Date -Format 'yyyyMMdd-HHmmss')"

        $appxPackageDir = "${{ env.APPX_PACKAGE_DIR }}"

        $msixFiles = Get-ChildItem -Path $appxPackageDir -Filter "*.msixbundle" -Recurse
        if ($msixFiles.Count -eq 0) { throw "No MSIXbundle found in $appxPackageDir" }
        $msixPath = $msixFiles[0].FullName

        $appinstallerFiles = Get-ChildItem -Path $appxPackageDir -Filter "*.appinstaller" -Recurse
        if ($appinstallerFiles.Count -eq 0) { throw "No Appinstaller found in $appxPackageDir" }
        $appinstallerPath = $appinstallerFiles[0].FullName

        if ([string]::IsNullOrEmpty($msixPath) -or [string]::IsNullOrEmpty($appinstallerPath)) {
          throw "Artifact path empty: MSIX($msixPath) | Appinstaller($appinstallerPath)"
        }

        echo "pre_release_version=$preReleaseVersion" >> $env:GITHUB_OUTPUT
        echo "msixbundle_path=$msixPath" >> $env:GITHUB_OUTPUT
        echo "appinstaller_path=$appinstallerPath" >> $env:GITHUB_OUTPUT
        Write-Host "Generated Pre-release version: $preReleaseVersion"

    # 步骤18：在 GitHub 上创建预发布版本（Release）
    - name: Create GitHub Pre-release
      id: create_pre_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      with:
        tag_name:        ${{ steps.get_pre_release_version.outputs.pre_release_version }}
        release_name:    "Files Sideload Pre-release ${{ steps.get_pre_release_version.outputs.pre_release_version }}"
        body: |
          ## 🚀 Files 侧载预发布
          自动构建生成 (Files CD sideload stable workflow).
      
          ### 📦 资源下载
          - **MSIX 包体平台**: x64
          - **自签名证书**: 侧载所需（有效期 365 天）
          - **Artifacts 压缩包**: 完整构建输出（与 GitHub Artifacts 中的 `Appx Packages (Release, x64).zip` 相同）
      
          ### 🔧 构建详情
          - 类型: ${{ env.CONFIGURATION }}
          - 平台: ${{ env.APPX_BUNDLE_PLATFORMS }}
          - 构建时间: ${{ steps.get_pre_release_version.outputs.pre_release_version }}
      
          ### ⚠️ 注意事项
          - 构建产物与 GitHub Artifacts 内容相同，可供离线使用
          - 请先安装自签名证书，然后再部署 MSIX 包体。

          ### 🪄安装步骤
          - 你需要开启 Windows 的开发者模式, 以便可以通过侧载包安装 UWP 应用
          - 开启步骤如下:- 进入 「设置」-(Windows 10) 打开 「更新和安全」 页面-(Windows 11) 打开 「隐私和安全性」 页面-(Windows 11 Beta 通道及以上) 打开 「系统」页面 
          - 选择 「开发者选项」-	打开 开发者模式,Windows 10 还需要勾选 「从任意源 (包括松散文件) 安装应用」
          -	找到页面下方 PowerShell 选项 (Windows 11 需要展开)- 勾选 「更改执行策略……」(Windows 10 需要点击应用)
          - 下载并双击运行自签名证书文件, 按照向导安装证书, 选择 「本地计算机」- 「将所有的证书都放到下列存储」-[点浏览选择受信任人并按提示安装即可] 
          - 下载并双击运行 MSIX 包体文件, 安装应用
          - 也可直接下载去action处下载 `Appx Packages (Release, x64).zip`, 解压后在 `AppxPackages\Files.Package_*_Test` 该路径中运行 `Install.ps1`
        draft: false
        prerelease: true
        target_commitish: ${{ github.ref_name }}

    # 步骤19：将 appinstaller 文件上传到 GitHub Release
    - name: Upload Appinstaller to Pre-release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      with:
        upload_url:     ${{ steps.create_pre_release.outputs.upload_url }}
        asset_path:     ${{ steps.get_pre_release_version.outputs.appinstaller_path }}
        asset_name:     Files.Package-${{ steps.get_pre_release_version.outputs.pre_release_version }}.appinstaller
        asset_content_type: application/xml
      continue-on-error: false

    # 步骤20：将 MSIX 捆绑包上传到 GitHub Release
    - name: Upload MSIXbundle to Pre-release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      with:
        upload_url:     ${{ steps.create_pre_release.outputs.upload_url }}
        asset_path:     ${{ steps.get_pre_release_version.outputs.msixbundle_path }}
        asset_name:     "Files.Package-${{ steps.get_pre_release_version.outputs.pre_release_version }}.msixbundle"
        asset_content_type: application/vnd.microsoft.msixbundle
      continue-on-error: false

    # 步骤21：将自签名 CER 证书上传到 GitHub Release
    - name: Upload Self-signed CER to Pre-release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      with:
        upload_url:    ${{ steps.create_pre_release.outputs.upload_url }}
        asset_path:    ${{ steps.generate_cert.outputs.cer_full_path }}
        asset_name:    "Files_SelfSigned-${{ steps.get_pre_release_version.outputs.pre_release_version }}.cer"
        asset_content_type: application/x-x509-ca-cert
      continue-on-error: false

    # 步骤22：清理旧的预发布版本（保留最新 10 个，避免 Release 列表冗余）
    - name: Clean up old Pre-releases
      id: clean_old_pre_releases
      shell: pwsh
      env:
        GH_PAT:              ${{ secrets.GH_PAT }}
        KEEP_LATEST:         10
        REPO:                "${{ github.repository_owner }}/${{ github.event.repository.name }}"
      run: |
        $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:REPO/releases?per_page=100" `
          -Headers @{ Authorization = "Bearer $env:GH_PAT"; Accept = "application/vnd.github+json" }
        $preReleases = $releases | Where-Object { $_.prerelease -and -not $_.draft }

        if ($preReleases.Count -le $env:KEEP_LATEST) {
          Write-Host "No clean-up needed (Pre-releases: $($preReleases.Count) ≤ $env:KEEP_LATEST)"
          exit 0
        }
        $preReleases | Sort-Object created_at -Descending | Select-Object -Skip $env:KEEP_LATEST | ForEach-Object {
          Write-Host "Deleting Pre-release: $($_.tag_name)"
          Invoke-RestMethod -Uri $_.url -Headers @{ Authorization = "Bearer $env:GH_PAT" } -Method Delete
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:REPO/git/refs/tags/$($_.tag_name)" `
            -Headers @{ Authorization = "Bearer $env:GH_PAT" } -Method Delete -ErrorAction SilentlyContinue
        }

        Write-Host "Cleaned up $($preReleases.Count - $env:KEEP_LATEST) old Pre-releases"
